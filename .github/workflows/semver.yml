name: SemVer checks
on:
  pull_request:
    branches:
      - main
      - redesign
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - converted_to_draft
  workflow_dispatch:
jobs:
  semver-checks:
    if: ${{ (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust stable toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile=minimal --default-toolchain stable
          rustup override set stable
      - name: Install SemVer Checker
        run: cargo install cargo-semver-checks --locked
      - name: Check SemVer with all features
        run: cargo semver-checks
      - name: Check SemVer without any non-default features
        run: cargo semver-checks --only-explicit-features
concurrency:
  group: batch-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && github.run_id || 'candidate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
