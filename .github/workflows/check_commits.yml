name: CI check_commits

on:
  pull_request:
    branches:
      - main
      - redesign
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - converted_to_draft
  workflow_dispatch:
concurrency:
  group: batch-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'edited' && github.event.changes.base == null && github.run_id || 'candidate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check_commits:
    if: ${{ (github.event_name != 'pull_request' || (!github.event.pull_request.draft && (github.event.action != 'edited' || github.event.changes.base != null))) }}
    runs-on: self-hosted
    env:
      TOOLCHAIN: stable
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust ${{ env.TOOLCHAIN }} toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile=minimal --default-toolchain ${{ env.TOOLCHAIN }}
      - name: Fetch full tree and rebase on upstream
        run: |
          git remote add upstream https://github.com/lightningdevkit/rust-lightning
          git fetch upstream
          export GIT_COMMITTER_EMAIL="rl-ci@example.com"
          export GIT_COMMITTER_NAME="RL CI"
          git rebase upstream/${{ github.base_ref }}
      - name: For each commit, run cargo check (including in fuzz)
        run: ci/check-each-commit.sh upstream/${{ github.base_ref }}

